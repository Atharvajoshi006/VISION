version: "3.9"

services:
  # --------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oblivion_db
      POSTGRES_USER: oblivion_user
      POSTGRES_PASSWORD: change_me
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------
  # Redis (caching + Channels layer)
  # --------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  # --------------------------------------------------------------
  # RabbitMQ (Celery broker)
  # --------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5672:5672", "15672:15672"]

  # --------------------------------------------------------------
  # Django (Gunicorn) – the main API server
  # --------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    env_file: .env
    depends_on: [db, redis, rabbitmq]
    ports: ["8000:8000"]
    networks: ["backend"]

  # --------------------------------------------------------------
  # Celery worker
  # --------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config.celery worker -l info
    env_file: .env
    depends_on: [web, rabbitmq, redis]
    networks: ["backend"]

  # --------------------------------------------------------------
  # Celery beat (periodic jobs)
  # --------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config.celery beat -l info
    env_file: .env
    depends_on: [worker]
    networks: ["backend"]

  # --------------------------------------------------------------
  # OPTIONAL: Local LLM inference service (open‑source transformer)
  # --------------------------------------------------------------
  llm:
    image: ghcr.io/huggingface/transformers-pytorch-cpu:latest   # CPU‑only base
    environment:
      MODEL_NAME: mistralai/Mistral-7B-Instruct-v0.2   # change to any HF repo
    ports: ["8001:8001"]
    networks: ["backend"]

networks:
  backend:

volumes:
  pgdata:
  redisdata:
